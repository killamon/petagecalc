<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pet Age Calculator: Dog & Cat Years in Human Years</title>
<meta name="description" content="Free dog and cat age calculator. Find out your pet’s age in human years.">
<style>
:root{--bg:#fff8f0;--card:#ffffff;--text:#2b2118;--muted:#6b5b4d;--accent:#e8590c;--border:#ecd9c6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1612;--card:#2a211b;--text:#f5ebe0;--muted:#b9a794;--accent:#ff8a4c;--border:#40332a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1612;--card:#2a211b;--text:#f5ebe0;--muted:#b9a794;--accent:#ff8a4c;--border:#40332a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.7rem;margin:8px 0}
p.sub{color:var(--muted);margin-top:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin:16px 0}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
label{display:block;font-weight:600;margin:10px 0 6px}
input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem}
.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer}
#out{text-align:center;display:none}
#out .big{font-size:3rem;font-weight:800;color:var(--accent);line-height:1.1}
.ad{min-height:90px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);border-radius:12px;color:var(--muted);font-size:.85rem;margin:16px 0}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:24px}
</style>
</head>
<body>
<main>
<h1>🐾 Pet Age Calculator</h1>
<p class="sub">See how old your dog or cat is in human years.</p>

<div class="card">
  <div class="tabs">
    <button id="tDog" class="on" type="button">🐶 Dog</button>
    <button id="tCat" type="button">🐱 Cat</button>
  </div>
  <label for="yrs">Pet’s age (years)</label>
  <input id="yrs" type="number" min="0" step="0.5" placeholder="e.g. 4">
  <div id="sizeWrap">
    <label for="size">Dog size</label>
    <select id="size">
      <option value="0">Small (under 20 lb)</option>
      <option value="1" selected>Medium (20–50 lb)</option>
      <option value="2">Large (over 50 lb)</option>
    </select>
  </div>
  <button class="go" id="go" type="button">Calculate</button>
</div>

<div class="card" id="out">
  <div>Your pet is about</div>
  <div class="big" id="num">0</div>
  <div>in human years</div>
  <p id="msg" style="color:var(--muted)"></p>
</div>

<!-- AD SLOT: paste your ad code here -->
<div class="ad">Ad space</div>

<footer>Estimates only. Every pet ages differently.</footer>
</main>
<script>
var pet="dog";
var tDog=document.getElementById("tDog"),tCat=document.getElementById("tCat");
function pick(p){pet=p;tDog.className=p==="dog"?"on":"";tCat.className=p==="cat"?"on":"";document.getElementById("sizeWrap").style.display=p==="dog"?"block":"none";}
tDog.onclick=function(){pick("dog")};tCat.onclick=function(){pick("cat")};
document.getElementById("go").onclick=function(){
  var y=parseFloat(document.getElementById("yrs").value);
  if(isNaN(y)||y<0){document.getElementById("yrs").focus();return;}
  var h;
  if(pet==="cat"){h=y<=1?y*15:y<=2?15+(y-1)*9:24+(y-2)*4;}
  else{
    var s=parseInt(document.getElementById("size").value,10);
    if(y<=1){h=y*15;}
    else{var base=16*Math.log(y)+31;h=base+(s-1)*y*0.4;if(h<15)h=15;}
  }
  h=Math.round(h);
  document.getElementById("num").textContent=h;
  var stage=h<18?"a puppy or kitten stage":h<40?"young adult":h<60?"middle-aged":"a senior";
  document.getElementById("msg").textContent="That’s roughly "+stage+".";
  document.getElementById("out").style.display="block";
};
pick("dog");
</script>
</body>
</html>
